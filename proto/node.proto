syntax = "proto3";

// Node-to-node RPC. Code generation is a Phase B step; nothing imports
// generated stubs yet.
package athanor.v1;

option go_package = "github.com/Arjun-Walia/Athanor/internal/api/nodepb";

service Node {
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
  rpc GetReplica(GetReplicaRequest) returns (GetReplicaResponse);
  rpc Repair(RepairRequest) returns (RepairResponse);
  rpc Hint(HintRequest) returns (HintResponse);
  rpc RingSnapshot(RingSnapshotRequest) returns (RingSnapshotResponse);
}

message ObjectMeta {
  string key = 1;
  uint64 version = 2;
  bytes checksum = 3;
  uint64 size = 4;
  string origin = 5;
  string hinted_for = 6;
}

message ReplicateRequest {
  ObjectMeta meta = 1;
  bytes body = 2;
}

message ReplicateResponse {
  bool stored = 1;
}

message GetReplicaRequest {
  string key = 1;
}

message GetReplicaResponse {
  bool found = 1;
  ObjectMeta meta = 2;
  bytes body = 3;
}

message RepairRequest {
  string key = 1;
}

message RepairResponse {
  uint64 winner_version = 1;
  repeated string pushed = 2;
  repeated string dropped = 3;
}

message HintRequest {
  string target = 1;
  ObjectMeta meta = 2;
  bytes body = 3;
}

message HintResponse {
  bool accepted = 1;
}

message RingSnapshotRequest {}

message Member {
  string id = 1;
  string addr = 2;
  string status = 3;
  uint64 ring_version = 4;
}

message RingSnapshotResponse {
  uint64 ring_version = 1;
  repeated Member members = 2;
}
