# Five independent vault-node processes on one bridge network.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:8081/app
#
# Host ports 8081-8085 are node1-node5's HTTP API (and dashboard). Gossip and
# gRPC stay on the compose network. Named volumes are the per-node disks.
#
# A sixth node joins on demand, to watch rebalance move keys onto it:
#   docker compose -f deploy/docker-compose.yml --profile scale up -d node6
#
# `docker compose stop node2` is a real crash. The dashboard's Stop button
# is the in-process equivalent: gossip and peer RPC go dark, HTTP admin stays
# up so the button can start the node again.
#
# For a public deployment add deploy/docker-compose.public.yml, which puts a
# health-checking gateway in front of all five nodes on one origin.

name: athanor

x-node: &node
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      VERSION: ${ATHANOR_VERSION:-dev}
  image: athanor/vault-node:local
  networks: [athanor]
  restart: unless-stopped
  # SIGTERM drains HTTP for up to --shutdown-timeout before the process exits.
  stop_grace_period: 15s
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/admin/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

# Every flag can also come from ATHANOR_* in the environment; the browser
# facing URL is set that way so an overlay can point all nodes at one origin.
services:
  node1:
    <<: *node
    hostname: node1
    ports: ["8081:8080"]
    volumes: ["node1:/data"]
    environment:
      ATHANOR_PUBLIC_URL: ${ATHANOR_PUBLIC_URL:-http://localhost:8081}
    command: ["--id=node1", "--advertise=node1", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node2,node3,node4,node5"]

  node2:
    <<: *node
    hostname: node2
    ports: ["8082:8080"]
    volumes: ["node2:/data"]
    environment:
      ATHANOR_PUBLIC_URL: ${ATHANOR_PUBLIC_URL:-http://localhost:8082}
    command: ["--id=node2", "--advertise=node2", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node3,node4,node5"]

  node3:
    <<: *node
    hostname: node3
    ports: ["8083:8080"]
    volumes: ["node3:/data"]
    environment:
      ATHANOR_PUBLIC_URL: ${ATHANOR_PUBLIC_URL:-http://localhost:8083}
    command: ["--id=node3", "--advertise=node3", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node2,node4,node5"]

  node4:
    <<: *node
    hostname: node4
    ports: ["8084:8080"]
    volumes: ["node4:/data"]
    environment:
      ATHANOR_PUBLIC_URL: ${ATHANOR_PUBLIC_URL:-http://localhost:8084}
    command: ["--id=node4", "--advertise=node4", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node2,node3,node5"]

  node5:
    <<: *node
    hostname: node5
    ports: ["8085:8080"]
    volumes: ["node5:/data"]
    environment:
      ATHANOR_PUBLIC_URL: ${ATHANOR_PUBLIC_URL:-http://localhost:8085}
    command: ["--id=node5", "--advertise=node5", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node2,node3,node4"]

  node6:
    <<: *node
    profiles: [scale]
    hostname: node6
    ports: ["8086:8080"]
    volumes: ["node6:/data"]
    environment:
      ATHANOR_PUBLIC_URL: ${ATHANOR_PUBLIC_URL:-http://localhost:8086}
    command: ["--id=node6", "--advertise=node6", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node2,node3,node4,node5"]

volumes:
  node1:
  node2:
  node3:
  node4:
  node5:
  node6:

networks:
  athanor:
