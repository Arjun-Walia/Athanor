# Five independent vault-node processes on one bridge network.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:8081/app
#
# Host ports 8081-8085 are node1-node5's HTTP API (and dashboard). Gossip and
# gRPC stay on the compose network. Named volumes are the per-node disks.
#
# A sixth node joins on demand, to watch rebalance move keys onto it:
#   docker compose -f deploy/docker-compose.yml --profile scale up -d node6
#
# `docker compose stop node2` is a real crash. The dashboard's Stop button
# is the in-process equivalent: gossip and peer RPC go dark, HTTP admin stays
# up so the button can start the node again.

name: athanor

x-node: &node
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: athanor/vault-node:local
  networks: [athanor]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/admin/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  node1:
    <<: *node
    hostname: node1
    ports: ["8081:8080"]
    volumes: ["node1:/data"]
    command: ["--id=node1", "--advertise=node1", "--public-url=http://localhost:8081", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node2,node3,node4,node5"]

  node2:
    <<: *node
    hostname: node2
    ports: ["8082:8080"]
    volumes: ["node2:/data"]
    command: ["--id=node2", "--advertise=node2", "--public-url=http://localhost:8082", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node3,node4,node5"]

  node3:
    <<: *node
    hostname: node3
    ports: ["8083:8080"]
    volumes: ["node3:/data"]
    command: ["--id=node3", "--advertise=node3", "--public-url=http://localhost:8083", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node2,node4,node5"]

  node4:
    <<: *node
    hostname: node4
    ports: ["8084:8080"]
    volumes: ["node4:/data"]
    command: ["--id=node4", "--advertise=node4", "--public-url=http://localhost:8084", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node2,node3,node5"]

  node5:
    <<: *node
    hostname: node5
    ports: ["8085:8080"]
    volumes: ["node5:/data"]
    command: ["--id=node5", "--advertise=node5", "--public-url=http://localhost:8085", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node2,node3,node4"]

  node6:
    <<: *node
    profiles: [scale]
    hostname: node6
    ports: ["8086:8080"]
    volumes: ["node6:/data"]
    command: ["--id=node6", "--advertise=node6", "--public-url=http://localhost:8086", "--http=:8080", "--grpc=:9090", "--gossip=0.0.0.0:7946", "--data=/data", "--seeds=node1,node2,node3,node4,node5"]

volumes:
  node1:
  node2:
  node3:
  node4:
  node5:
  node6:

networks:
  athanor:
